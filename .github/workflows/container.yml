name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: code-oss/build/nginx-routes/go.mod
          cache-dependency-path: code-oss/build/nginx-routes/go.mod
      - name: Test the route generator
        working-directory: code-oss/build/nginx-routes
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile ARGs are the only version pin; the image is tagged with it.
      - name: Read pinned upstream version
        id: versions
        run: |
          tag="$(grep -m1 '^ARG VSCODE_TAG=' code-oss/Dockerfile | cut -d= -f2)"
          commit="$(grep -m1 '^ARG VSCODE_COMMIT=' code-oss/Dockerfile | cut -d= -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: jlumbroso/free-disk-space@v1.3.2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.versions.outputs.tag }}
            type=raw,value=${{ steps.versions.outputs.commit }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Code - OSS web
            org.opencontainers.image.description=Self-hosted Code - OSS web IDE and Agents Window
            org.opencontainers.image.revision=${{ steps.versions.outputs.commit }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: code-oss
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VSCODE_TAG=${{ steps.versions.outputs.tag }}
            VSCODE_COMMIT=${{ steps.versions.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
