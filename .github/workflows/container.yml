name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code-oss/build/nginx-routes/go.mod

      - name: Test the route generator
        working-directory: code-oss/build/nginx-routes
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.versions.outputs.tag }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read pinned upstream version
        id: versions
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^ARG VSCODE_TAG=//p' code-oss/Dockerfile | head -n 1)"
          commit="$(sed -n 's/^ARG VSCODE_COMMIT=//p' code-oss/Dockerfile | head -n 1)"
          test -n "$tag" && test -n "$commit"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: code-oss
          file: code-oss/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VSCODE_TAG=${{ steps.versions.outputs.tag }}
            VSCODE_COMMIT=${{ steps.versions.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.versions.outputs.tag }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.versions.outputs.commit }}
          labels: |
            org.opencontainers.image.title=Code - OSS web
            org.opencontainers.image.description=Self-hosted Code - OSS web IDE and Agents Window
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.versions.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.versions.outputs.commit }}
            org.opencontainers.image.licenses=MIT

      - name: Report image digest
        run: |
          echo "image=${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          {
            echo "### Image"
            echo ""
            echo "\`${{ env.IMAGE }}:${{ steps.versions.outputs.tag }}\`"
            echo ""
            echo "\`${{ env.IMAGE }}@${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VSCODE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the pushed image
        run: docker pull --platform linux/amd64 "$IMAGE:$VSCODE_TAG"

      - name: Run and probe
        run: |
          set -euo pipefail
          # Direct (browser-dialled) host only: no proxy route, so the container
          # needs no reachable backend to start.
          cat > smoke-config.json <<'JSON'
          {
            "remoteAgentHosts": [
              { "name": "smoke", "address": "wss://example.invalid/ahp" }
            ]
          }
          JSON
          docker run -d --name smoke -p 8080:80 \
            -v "$PWD/smoke-config.json:/usr/share/nginx/html/config.json:ro" \
            "$IMAGE:$VSCODE_TAG"
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200" || { docker logs smoke; exit 1; }

          check() {
            local path="$1" want_type="$2" want_size="$3" out code ctype size
            out="$(curl -sS -o /dev/null -w '%{http_code}|%{content_type}|%{size_download}' "http://127.0.0.1:8080$path")"
            code="${out%%|*}"; out="${out#*|}"; ctype="${out%%|*}"; size="${out##*|}"
            printf '%s -> %s %s %s bytes\n' "$path" "$code" "$ctype" "$size"
            [ "$code" = "200" ] || return 1
            printf '%s' "$ctype" | grep -qi "$want_type" || return 1
            [ -z "$want_size" ] || [ "$size" -ge "$want_size" ] || return 1
          }
          check / text/html 4000
          check /agents text/html 4000
          check /index.js application/javascript 1000
          check /agents.js application/javascript 1000
          check /shell.js application/javascript 500
          check /version.js application/javascript 40
          check /config.json application/json 10
          check /out/vs/workbench/workbench.web.main.internal.js application/javascript 10000000
          check /out/vs/sessions/sessions.web.main.internal.js application/javascript 10000000
          check /out/nls.messages.js application/javascript 100000
          check /extensions/theme-defaults/package.json application/json 100

          echo "=== unconfigured /ahp is not the workbench ==="
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ahp)"
          printf '/ahp -> %s\n' "$code"
          [ "$code" = "404" ]

          echo "=== product.json patch reached the bundles ==="
          for js in /out/vs/workbench/workbench.web.main.internal.js /out/vs/sessions/sessions.web.main.internal.js; do
            if curl -sS "http://127.0.0.1:8080$js" | grep -qE 'falcon-caas\.mai\.microsoft\.com|api\.github\.com/copilot_internal'; then
              echo "::error::$js still contains an internal Microsoft endpoint"
              exit 1
            fi
            printf '%s -> patched\n' "$js"
          done

          echo "=== no Microsoft service references in served HTML ==="
          if curl -sS http://127.0.0.1:8080/ http://127.0.0.1:8080/agents \
            | grep -Eio 'microsoft\.com|vscode\.dev|vscode-cdn\.net|marketplace\.visualstudio\.com|aka\.ms' ; then
            echo "::error::forbidden reference in served HTML"
            exit 1
          fi
          echo "none"

          echo "=== attribution ==="
          curl -sS -o /dev/null -w 'LICENSE.txt %{http_code}\n' http://127.0.0.1:8080/LICENSE.txt
          curl -sS -o /dev/null -w 'ThirdPartyNotices.txt %{http_code}\n' http://127.0.0.1:8080/ThirdPartyNotices.txt

          docker rm -f smoke
