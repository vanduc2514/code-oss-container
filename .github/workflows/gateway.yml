name: gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gateway/**
      - .github/workflows/gateway.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ahp-gateway

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile ARG is the only version pin, and it tags the image.
      - name: Read gateway version
        id: version
        run: |
          version="$(grep -m1 '^ARG GATEWAY_VERSION=' gateway/Dockerfile | cut -d= -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=AHP ACP Gateway
            org.opencontainers.image.description=Agent Host Protocol gateway for the Code - OSS Agents Window
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GATEWAY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
